server:
  port: 8080

spring:
  application:
    name: nokia-sms-backend
  datasource:
    url: jdbc:h2:file:./data/smsdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true